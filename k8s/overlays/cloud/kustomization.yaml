apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ==============================================================================
# OVERLAY CLOUD — ACTIF (cluster k3s single-node sur EC2, CNI Calico, ns btp-app)
# ------------------------------------------------------------------------------
# Cible réelle : k3s v1.35 sur EC2 Ubuntu 22.04 (eu-west-3), endpoint stable via
# Elastic IP. Différences avec overlays/dev (Docker Desktop) :
#   - Images tirées de Docker Hub elhoussatia/* (tag immuable), PAS d'images locales.
#   - StorageClass forcée à local-path (provisioner par défaut de k3s).
#   - SealedSecrets RE-SCELLÉS pour la clé du controller k3s (cf. sealed-secrets/).
#
#   Rendu  : kubectl kustomize k8s/overlays/cloud
#   Déploi : via Argo CD (Application btp-app-cloud), sync manuel d'abord.
# ==============================================================================

resources:
  - ../../base
  - sealed-secrets               # 9 SealedSecrets scellés pour k3s (clé sealed-secrets-keygk4wb)
  - rabbitmq-enabled-plugins.yaml # ConfigMap requise par le Deployment rabbitmq du base
                                  # (vit dans monitoring/, absente du cluster k3s vierge)

# Namespace cohérent avec le scope STRICT des SealedSecrets (name+namespace=btp-app).
# /!\ Changer ce namespace invaliderait le déchiffrement des SealedSecrets.
namespace: btp-app

# ------------------------------------------------------------------------------
# IMAGES — repointe les images locales (dev) vers Docker Hub elhoussatia/*.
# Tag immuable (git SHA) — surtout PAS "latest" pour la reproductibilité.
# ------------------------------------------------------------------------------
images:
  - name: affaire-service
    newName: elhoussatia/affaire-service
    newTag: 88da32bbad6d57c8adde03c3692379336790eed6
  - name: controle-service
    newName: elhoussatia/controle-service
    newTag: 88da32bbad6d57c8adde03c3692379336790eed6
  - name: notification-service
    newName: elhoussatia/notification-service
    newTag: 88da32bbad6d57c8adde03c3692379336790eed6
  - name: btp-api-gateway
    newName: elhoussatia/api-gateway
    newTag: 88da32bbad6d57c8adde03c3692379336790eed6
  - name: btp-plan
    newName: elhoussatia/plan-service
    newTag: 88da32bbad6d57c8adde03c3692379336790eed6
  - name: btp-user-service
    newName: elhoussatia/user-service
    newTag: 88da32bbad6d57c8adde03c3692379336790eed6
  - name: btp-frontend
    newName: elhoussatia/frontend
    newTag: 88da32bbad6d57c8adde03c3692379336790eed6
  - name: btp-eureka-server
    newName: elhoussatia/eureka-server
    newTag: 88da32bbad6d57c8adde03c3692379336790eed6
  # Infra (mongo, rabbitmq, mongodb-exporter) = images publiques, non repointées.

# ------------------------------------------------------------------------------
# STORAGECLASS — k3s provisionne via local-path (hostPath dynamique sur le node).
# On la force explicitement sur tous les PVC (mongodb-pvc, plan-uploads-pvc) au
# lieu de dépendre de la SC par défaut (portabilité du manifest).
# ------------------------------------------------------------------------------
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: local-path
