apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Composants d'infrastructure partagés par les services applicatifs.
# mongodb-exporter est un manifest BRUT (pas un release Helm) : il est donc
# piloté par Kustomize ici, contrairement au reste du monitoring (kube-prometheus-stack)
# qui reste géré par Helm sous k8s/monitoring/.
resources:
  - eureka-server
  - mongodb
  - rabbitmq
  - mongodb-exporter
