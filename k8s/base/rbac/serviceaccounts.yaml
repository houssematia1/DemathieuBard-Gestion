# ==============================================================================
# RBAC — ServiceAccounts dédiés (least-privilege)  —  namespace: btp-app
# ==============================================================================
# Investigation (voir rbac/PHASE-RBAC-REPORT.md) : AUCUN de ces workloads
# n'appelle l'API Kubernetes.
#   - Découverte de service  : Eureka (spring-cloud-starter-netflix-eureka-client)
#   - Config / secrets       : env vars injectées (ConfigMap + Sealed Secrets),
#                              PAS de lecture live via l'API server.
#   - Comm. inter-services   : RestTemplate @LoadBalanced via Eureka.
#
# => Chaque service reçoit son PROPRE ServiceAccount, SANS aucun Role/RoleBinding
#    (zéro permission), et le montage du token est désactivé.
#
# Pourquoi pas de Role/RoleBinding ici ?
#   Un ServiceAccount sans RoleBinding n'a, par défaut, AUCUN droit sur l'API
#   (deny-by-default). Inutile d'écrire un Role vide : l'absence de binding EST
#   le least-privilege. On documente l'intention, on ne crée pas d'objet inutile.
#
# Défense en profondeur : automountServiceAccountToken:false est posé
#   (1) ici au niveau du ServiceAccount, ET
#   (2) au niveau du pod spec de chaque Deployment.
#   Le réglage du pod l'emporte ; le doublon protège si un futur Deployment
#   oublie de le repréciser.
# ==============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service-sa
  namespace: btp-app
  labels:
    app: user-service
    app.kubernetes.io/component: rbac
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
