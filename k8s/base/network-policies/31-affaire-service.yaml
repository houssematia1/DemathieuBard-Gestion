# ==============================================================================
# affaire-service — port app/metrics 8081
# ==============================================================================
# INGRESS : api-gateway (routage) + Prometheus (metrics) sur 8081.
# EGRESS  : eureka:8761 + mongodb:27017. DNS via policy globale 01.
# Pas de RabbitMQ, pas d'appel inter-service sortant.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: affaire-service
  namespace: btp-app
spec:
  podSelector:
    matchLabels:
      app: affaire-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: eureka-server
      ports:
        - protocol: TCP
          port: 8761
    - to:
        - podSelector:
            matchLabels:
              app: mongodb
      ports:
        - protocol: TCP
          port: 27017
