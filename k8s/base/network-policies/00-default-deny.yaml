# ==============================================================================
# 00 — DEFAULT DENY (ingress + egress) — SCOPÉ AUX 7 WORKLOADS APPLICATIFS
# ==============================================================================
# CORRECTION D'ARCHITECTURE (Option A) : le stack kube-prometheus
# (prometheus / grafana / operator / kube-state-metrics) tourne DANS le
# namespace btp-app, pas dans un namespace `monitoring` séparé.
#
# On NE veut PAS isoler l'observabilité (composant d'infra hors périmètre de la
# segmentation applicative). Or une policy qui sélectionne un pod l'isole sur la
# direction concernée. On remplace donc l'ancien `podSelector: {}` (= tout le
# namespace, monitoring compris) par un selector qui ne vise QUE les 7 workloads
# métier (microservices + frontend).
#
# Conséquence :
#   - Les 7 services métier sont en deny-by-default (puis allowlist 10..34).
#   - L'infra eureka/mongodb/rabbitmq/mongodb-exporter reste isolée par ses
#     PROPRES policies (40..43), pas besoin du catch-all ici.
#   - Le stack monitoring n'est sélectionné par AUCUNE policy => reste libre.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: btp-app
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - user-service
          - api-gateway
          - plan-service
          - affaire-service
          - controle-service
          - notification-service
          - frontend
  policyTypes:
    - Ingress
    - Egress
