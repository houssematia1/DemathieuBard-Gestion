# ==============================================================================
# 01 — ALLOW DNS EGRESS — pour TOUS les pods ISOLÉS (7 métier + 4 infra)
# ==============================================================================
# Après le default-deny egress, un pod isolé ne peut plus résoudre un nom DNS.
# Tout passe par des noms ("mongodb", "eureka-server", "rabbitmq", ...), donc
# sans cette règle ces pods cassent (UnknownHost).
#
# SCOPE (important) :
#   - On cible les 11 pods ISOLÉS : les 7 workloads métier (couverts par le
#     default-deny 00) + les 4 infra eureka/mongodb/rabbitmq/mongodb-exporter
#     (isolés par leurs propres policies 40..43, qui ont policyType Egress).
#     Ex. mongodb-exporter DOIT résoudre "mongodb" (--mongodb.uri=...@mongodb).
#   - On EXCLUT le stack monitoring : lui accorder un egress DNS via cette policy
#     reviendrait à le SÉLECTIONNER pour l'egress, donc à l'ISOLER
#     (NetworkPolicy = tout pod sélectionné est isolé sur la direction). Prometheus
#     ne pourrait alors plus scraper ni joindre l'API. Le monitoring doit rester
#     hors de toute policy.
#
# Cible DNS : CoreDNS dans kube-system, label k8s-app=kube-dns (vérifié),
#             UDP + TCP 53 (TCP requis pour les réponses > 512 octets).
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: btp-app
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - user-service
          - api-gateway
          - plan-service
          - affaire-service
          - controle-service
          - notification-service
          - frontend
          - eureka-server
          - mongodb
          - rabbitmq
          - mongodb-exporter
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
