name: secret-scan

# Job de securite "fail-fast" : detecte les secrets AVANT tout build/test/deploy.
# Si un secret est trouve, le pipeline echoue immediatement et aucun job aval
# (build, image Docker, deploiement) ne demarre. On evite ainsi qu'un secret
# fuite soit propage dans une image ou un artefact.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Annule les runs precedents encore en cours sur la meme ref (economie de CI).
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read          # lecture du repo
  pull-requests: read     # contexte PR pour l'action gitleaks

jobs:
  gitleaks:
    name: gitleaks (secret detection)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 = clone complet de l'historique.
          # Indispensable pour que gitleaks scanne TOUS les commits d'une PR,
          # pas seulement le dernier.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Pointe vers notre config custom (allowlist des sealed-secrets).
          GITLEAKS_CONFIG: gitleaks/.gitleaks.toml
          # GITLEAKS_ENABLE_COMMENTS: poste les findings en commentaire de PR.
          GITLEAKS_ENABLE_COMMENTS: "true"
          # Resume agrege dans le job summary GitHub.
          GITLEAKS_ENABLE_SUMMARY: "true"
          # GITLEAKS_LICENSE: requis UNIQUEMENT pour les organisations GitHub
          # (gratuit pour comptes perso / repos publics). A definir en secret repo
          # si le projet passe sous une organisation :
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

# Remarque : l'action gitleaks/gitleaks-action retourne un exit code != 0
# des qu'un secret est detecte -> le step echoue -> le job echoue -> le
# workflow est rouge. C'est exactement le comportement "fail-fast" voulu.
