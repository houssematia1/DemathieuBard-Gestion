name: CI - Backend + Frontend Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build eureka-server
        working-directory: ./eureka-server
        run: mvn -B clean package -DskipTests

      - name: Build api-gateway
        working-directory: ./api-gateway
        run: mvn -B clean package -DskipTests

      - name: Build user-service
        working-directory: ./user-service
        run: mvn -B clean package -DskipTests

      - name: Build plan-service
        working-directory: ./plan-service
        run: mvn -B clean package -DskipTests

      - name: Build notification-service
        working-directory: ./notification-service
        run: mvn -B clean package -DskipTests

      - name: Build affaire-service
        working-directory: ./affaire-service
        run: mvn -B clean package -DskipTests

      - name: Build controle-service
        working-directory: ./controle-service
        run: mvn -B clean package -DskipTests

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend-angular/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend-angular
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend-angular
        run: npm run build